<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Automation System Runtime</title>
  <desc id="desc">Local-first industrial automation runtime with explicit authority boundaries</desc>
