name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-regression:
    name: Linux regression / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate shell line endings
        shell: bash
        run: |
          if grep -Ilr $'\r' --include='*.sh' .; then
            echo 'CRLF detected in a shell script' >&2
            exit 1
          fi

      - name: Run complete worker validation
        shell: bash
        run: |
          chmod 0755 run_worker.sh install_mqtt_identity.sh test_all.sh
          ./test_all.sh

      - name: Verify no private key material is tracked
        shell: bash
        run: |
          if find . -type f \( -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -print | grep .; then
            echo 'Private key material is present in the repository' >&2
            exit 1
          fi
